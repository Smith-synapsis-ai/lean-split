<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets us paint under the Dynamic Island; safe-area insets keep content clear. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lean Split</title>
  <meta name="description" content="A calm, offline workout log: upper/lower split, rest timer, cardio and body-weight trend.">
  <meta name="theme-color" content="#071a2e">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lean Split">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="modulepreload" href="js/app.js">
</head>
<body>
  <div id="update-banner" class="update-banner" hidden>
    <button data-act="update" data-testid="update-banner">Update available. Tap to refresh</button>
  </div>

  <main id="view" class="view" aria-live="polite">
    <p class="loading">Loading…</p>
  </main>

  <!-- Rest timer: fixed above the tab bar. Timestamp based, survives screen lock. -->
  <div id="restbar" class="restbar" hidden data-testid="restbar">
    <div class="rb-fill-track"><span id="rb-fill"></span></div>
    <div class="rb-main">
      <div><div id="rb-time" class="rb-time" data-testid="rest-time">0:00</div><div id="rb-label" class="rb-label"></div></div>
      <div class="rb-btns">
        <button data-act="rest-add" data-testid="rest-add">+30 s</button>
        <button data-act="rest-skip" data-testid="rest-skip">Skip</button>
      </div>
    </div>
  </div>

  <nav id="tabbar" class="tabbar" aria-label="Main">
    <a href="#today" data-tab="today" data-testid="tab-today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h3v4H3zM18 10h3v4h-3zM6 7h3v10H6zM15 7h3v10h-3zM9 11h6v2H9z"/></svg><span id="tab-today-label">Today</span></a>
    <a href="#log" data-tab="log" data-testid="tab-log"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5" fill="none" stroke="currentColor" stroke-width="2"/></svg><span>Log</span></a>
    <a href="#history" data-tab="history" data-testid="tab-history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19l5-6 4 3 7-9" fill="none" stroke="currentColor" stroke-width="2.2"/></svg><span>History</span></a>
    <a href="#plan" data-tab="plan" data-testid="tab-plan"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l2.8 2.8M16.2 16.2L19 19M5 19l2.8-2.8M16.2 7.8L19 5" stroke="currentColor" stroke-width="2"/></svg><span>Plan</span></a>
  </nav>

  <div id="toast" class="toast" role="status" hidden></div>
  <div id="modal-root" hidden></div>
  <div class="flash-layer" aria-hidden="true"></div>

  <noscript><p class="loading">Lean Split needs JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
